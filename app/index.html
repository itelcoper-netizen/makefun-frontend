<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>make.fun — lean bounty board</title>
<meta name="description" content="A fast, read-only client for make.fun: live bounty board, bounty pages, leaderboards and public profiles, straight from the public API.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230b54d6'/%3E%3Ctext x='16' y='23' font-size='18' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='bold'%3E%E2%97%86%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="top">
  <a class="brand" href="#/"><span class="brand-mark">◆</span> make.fun <em>lean client</em></a>
  <nav class="top-nav" aria-label="Sections">
    <a href="#/">Board</a>
    <a href="#/all">All bounties</a>
  </nav>
  <form class="handle-search" id="handle-search" role="search" aria-label="Find a profile">
    <label class="visually-hidden" for="handle-input">Account handle</label>
    <input id="handle-input" name="handle" type="search" placeholder="Profile handle, e.g. superskie" autocomplete="off" spellcheck="false">
    <button type="submit">Profile</button>
  </form>
</header>
<div class="brand-bar" aria-hidden="true"></div>
<main id="view" aria-live="polite"></main>
<footer class="foot">
  <p>Read-only client for <a href="https://make.fun">make.fun</a> — live data from the public API, no sign-in, no tracking.
  <span id="foot-stats"></span></p>
</footer>
<script type="module" src="/main.js"></script>
</body>
</html>
